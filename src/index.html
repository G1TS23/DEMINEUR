<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Démineur</title>
  <meta name="description" content="Le démineur classique, jouable dans le navigateur : quatre niveaux de difficulté, de Facile à Cauchemar, et un mode drapeau.">
  <meta name="google-site-verification" content="EzLJyfi1es6usmPOdk846im38M2Z7Bx4dGT_Ul3FS2g" />
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Nom affiché par Google à la place du sous-domaine netlify.app. Le bloc
       WebSite est ce qui le décide ; og:site_name n'est qu'un signal
       secondaire. Placé ici, dans le HTML statique, pour qu'un crawler le voie
       sans exécuter Angular. -->
  <meta property="og:site_name" content="Démineur">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Démineur",
      "url": "https://boom-boom-boom.netlify.app/"
    }
  </script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    .site-credit {
      position: fixed;
      right: 0.6rem;
      bottom: 0.5rem;
      z-index: 9999;
      font-family: "Montserrat", sans-serif;
      font-size: 0.72rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
    }
    .site-credit a { color: #fff; text-decoration: none; }
    .site-credit a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <app-root></app-root>
  <footer class="site-credit">
    <a href="https://olivier.falahi.org" target="_blank" rel="noopener">Un projet d'Olivier Falahi ↗</a>
  </footer>
</body>
</html>
